# Recall's pipeline: format check, compile with warnings as errors, the test suite (which loads
# MiniLM, so its weights are cached between runs), then build the image, prove it starts
# and serves, publish it to GitHub's container registry, and deploy it to Google Cloud Run.
# Pull requests run the checks and the image build, nothing that publishes.
#
# The Cloud Run step runs once the repository has the variables GCP_PROJECT, GCP_WIF_PROVIDER and
# GCP_DEPLOYER (printed by cloudrun-setup.sh in the conveyor repo). It logs in without a stored key, through workload identity.
name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/recall

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Cache dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}

      - name: Cache MiniLM's weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/bumblebee
          key: bumblebee-minilm-v1

      - name: Dependencies
        run: mix deps.get

      - name: Formatting
        run: mix format --check-formatted

      - name: Build
        run: mix compile --warnings-as-errors

      - name: Tests
        run: mix test

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        # Runs the way Hugging Face runs it: port 7860, no secrets, no network needed after start.
        run: |
          tag=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run -d --name recall -p 7860:7860 -e SPACE_HOST=localhost "$tag"
          for i in $(seq 1 60); do curl -fs localhost:7860/ -o page.html && break; sleep 2; done
          grep -q "Study what you actually wrote down" page.html
          curl -sI localhost:7860/ | tee headers.txt
          grep -qi "frame-ancestors 'self' https://huggingface.co" headers.txt
          docker image inspect "$tag" --format 'image size: {{.Size}} bytes'
          docker logs recall

      - name: Log in to GitHub's container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  deploy:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGION: us-east1
      AR_IMAGE: us-east1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/apps/recall
    steps:
      # Keyless: GitHub vouches for this repository and Google lets it act as the deployer.
      - name: Log in to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Copy the image to Google Cloud
        # Cloud Run only runs images from Google's own registry, so this commit's tested image is
        # copied there from GHCR rather than built again.
        run: |
          SHA="${GITHUB_SHA::7}"
          gcloud auth configure-docker us-east1-docker.pkg.dev --quiet
          docker pull "$IMAGE:$SHA"
          docker tag "$IMAGE:$SHA" "$AR_IMAGE:$SHA"
          docker push "$AR_IMAGE:$SHA"

      - name: Publish to Cloud Run
        # Keeps one instance always warm so the app never sleeps; capped so a traffic spike can't run up a bill.
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          SHA="${GITHUB_SHA::7}"
          # The Groq key, if the repo has one, rides along as an environment variable.
          extra=""
          if [ -n "$GROQ_API_KEY" ]; then extra="--update-env-vars=GROQ_API_KEY=$GROQ_API_KEY"; fi
          gcloud run deploy recall --image "$AR_IMAGE:$SHA" --region "$REGION" \
            --port 7860 --memory 2Gi --cpu 1 --cpu-boost \
            --min-instances 1 --max-instances 2 --timeout 3600 \
            --allow-unauthenticated --quiet $extra
          url=$(gcloud run services describe recall --region "$REGION" --format 'value(status.url)')
          echo "Live at $url"
          for i in $(seq 1 30); do curl -fs "$url/" -o page.html && break; sleep 4; done
          grep -q "<title" page.html
